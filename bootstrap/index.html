<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Menu -->
    <div id="menu-container"></div>

    <!-- Content here -->
    <div class="container">
        <!-- Content here -->
    <h3 class="alert mt-4" style="background-color: #faedcd;">หน้าหลัก</h3>

    <div class="alert text-center" role="alert" style="background-color: #fefae0;">
        Natthaya Jaengchut 
    </div>
    
    <div class="text-end">
    <a class="btn btn-warning" href="https://www.google.com/" >Google</a>
    </div>
    </div>

    <!-- แบ่งคอลัมน์ด้วย grid system -->
    <div class="container text-center mt-4" >
        <div class="row">
          <div class="col-sm-4  bg-danger-subtle">
            <img src="../image/cartoon-8956457_640.jpg " width = 100%>
            แมว
          </div>

          <div class="col-sm-4 bg-warning-subtle">
            <img src="../image/images.jpg" width = 100%>
            การ์ตูน
          </div>

          <div class="col-sm-4 bg-success-subtle">
            <h4 class="mt-4">Register</h4>
            <form class="text-start">
                <div class="mb-3">
                  <label class="form-label">Firstname</label>
                  <input type="text" class="form-control" id="Firstname" required placeholder="input Firstname">
                </div>

                <div class="mb-3">
                  <label class="form-label">Lastname</label>
                  <input type="text" class="form-control" id="Lastname" required placeholder="input Lastname">
                </div>

                <div class="mb-3">
                    <label class="form-label">Telephone</label>
                    <input type="tel" class="form-control" id="telephone" required placeholder="ex.xxx-xxx-xxxx">
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Province</label>
                    <select class="form-select" id="pro">
                        <option selected>เลือกจังหวัด</option>
                        <option value="1">ระยอง</option>
                        <option value="2">ชลบุรี</option>
                        <option value="3">จันทบุรี</option>
                      </select>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" required placeholder="input E-mail">
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="pw" required placeholder="input Password">
                  </div>

                <div class="mb-3 text-center">
                <button type="reset" class="btn btn-secondary">Cencel</button>
                <button type="Submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
          </div>

        </div>
      </div>


</body>
</html>

<script src="js/bootstrap.bundle.min.js" ></script>
<script src="js/menu.js" ></script>
